# CI Workflow for HW2 - Constraint-Aware Course Planner
#
# This workflow runs only when you start it by hand: on GitHub, open the Actions
# tab, choose "CI", and click "Run workflow". Students must fix all issues to make
# CI pass.
#
# In most projects, CI runs automatically on every push and pull request, with a
# trigger like this instead of `workflow_dispatch`:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#
# We don't do that here because your repository is private: GitHub Actions minutes
# for private repositories come out of your personal account's free monthly
# quota, which other courses may need too. Run the checks in your container
# first, and use CI to confirm.
#
# Every job runs inside the same Docker image you develop in (see
# .devcontainer/), with Node.js and all npm packages preinstalled, so a command
# that passes in your container should pass here, and on Gradescope, too.
#
# The steps call the tools directly (eslint, tsc, tsx, vitest). The `npm run`
# scripts in package.json run the same commands; see the README.
#
# Jobs:
# 1. quality - Linting (ESLint) and type checking (tsc)
# 2. tests - Build the database, then run the unit tests (vitest)

name: CI

on:
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality (lint + typecheck)
    runs-on: ubuntu-latest
    container: ghcr.io/brandeis-cosi-106b/hw2-fa26:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run linter (ESLint)
        run: eslint src/ tests/

      - name: Run type checker (tsc)
        run: tsc --noEmit

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container: ghcr.io/brandeis-cosi-106b/hw2-fa26:latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Initialize and seed the database
        run: tsx src/db/migrate.ts && tsx src/db/seed.ts

      - name: Run tests
        run: vitest run
